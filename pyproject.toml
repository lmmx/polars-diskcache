[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12"]

[dependency-groups]
dev = [
  "pdbpp>=0.12.1",
  "polars>=1.36"
]
debug = ["pysnooper>=1.2.3"]
test = ["pytest>=8.4.1"]

[project]
name = "polars-diskcache"
version = "0.1.4"
description = "A diskcache decorator for Polars DataFrames and LazyFrames that saves function results as Parquet files"
readme = "README.md"
authors = [{name = "Louis Maddox", email = "louismmx@gmail.com"}]
requires-python = ">=3.13"
dependencies = ["diskcache>=5.6.3", "ty-extensions>=0.1.0", "xxhash>=3.5.0"]

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google" # or "numpy" if you prefer

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "plcache"
module-root = "src"
