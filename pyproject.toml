[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.11.6,<0.12"]

[dependency-groups]
debug = [
    "pysnooper>=1.2.3",
]
dev = [
    "pdbpp>=0.12.1",
    "polars>=1.36",
]
test = [
    "pytest>=8.4.1",
]

[project]
authors = [
    {email = "louismmx@gmail.com", name = "Louis Maddox"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "diskcache>=5.6.3",
    "ty-extensions>=0.1.0",
    "xxhash>=3.5.0",
]
description = "A diskcache decorator for Polars DataFrames and LazyFrames that saves function results as Parquet files"
keywords = [
    "cache",
    "dataframes",
    "diskcache",
    "parquet",
    "performance",
    "polars",
]
name = "polars-diskcache"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.4"

[project.optional-dependencies]
debug = [
    "pysnooper>=1.2.3",
]
dev = [
    "pdbpp>=0.12.1",
    "polars>=1.36",
]
test = [
    "pytest>=8.4.1",
]

[project.urls]
Documentation = "https://github.com/lmmx/polars-diskcache#readme"
Homepage = "https://github.com/lmmx/polars-diskcache"
Issues = "https://github.com/lmmx/polars-diskcache/issues"
Repository = "https://github.com/lmmx/polars-diskcache.git"

[tool.ruff]
exclude = [
    "examples",
]
line-length = 110

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.tomlsort]
all = true
in_place = true
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "plcache"
module-root = "src"
